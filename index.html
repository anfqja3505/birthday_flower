<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="내가 태어난 날의 탄생화는 무엇일까 알아봅시다.">
    <meta name="keywords" content="탄생화, 탄생꽃, 생일꽃">
    <title>나의 탄생화는 무엇일까?</title>
    <link rel="shortcut icon" href="https://cdn-icons-png.flaticon.com/128/11504/11504574.png" type="image/x-icon">
    <link rel="stylesheet" href="./styles/reset.css">
    <link rel="stylesheet" href="./styles/index.css">
    <script src="./scripts/index.js" defer></script>
</head>
<body>
    <main>
        <div class="title">
            <p>The Flower of My Birth Day</p>
            <h1>나의 탄생화 찾기</h1>
        </div>
        <form action="#" method="get" id="frm1" name="frm1">
            <input type="number" name="user_birthday" id="user_birthday" placeholder="태어난 달을 숫자로 입력해주세요." autofocus onclick="insertMonth()"> 
            <button id="birthday_result_btn" onclick="popupOpen()">나의 꽃과 꽃말 만나기</button>
            <!-- a태그는 클릭 시 다른페이지로 이동 -->
            <!-- button 태그 클릭 시 범용기능 동적표현 -->
        </form>
        <!-- (아래) 결과창 -->
        <div class="result_popup">
            <h2>birthday Month 12</h2>
            <p>꽃말 : 자기애, 자존심, 외로움</p>
            <p>당신의 탄생화는<br><em>‘수선화’</em>입니다.</p>
        </div> 
        <div class="birthday_flower_bg" onclick="popupClose()"></div>
    </main>
</body>
</html>
